[package]
name = "wincut"
version = "1.0.0"
edition = "2021"
rust-version = "1.86"
description = "WinCut - copy trading on NEAR where the fee is only ever taken from profit"
repository = "https://github.com/Mansi2007275/WinCut"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"
primitive-types = { version = "0.14", default-features = false }

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
strip = true
